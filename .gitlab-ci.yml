stages:
  - lint
  - test
  - build
  - release

variables:
  CGO_ENABLED: "1"

lint:
  stage: lint
  image: golang:1.26
  script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  script:
    - go mod download
    - go test ./... -v

build:
  stage: build
  image: golang:1.26
  script:
    - go mod download
    - go build -o opencode-msb ./cmd/opencode-msb
    - ./opencode-msb --version
  artifacts:
    paths:
      - opencode-msb

release:
  stage: release
  image: golang:1.26
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - go build -o opencode-msb-linux-amd64 ./cmd/opencode-msb
  artifacts:
    paths:
      - opencode-msb-linux-amd64
  release:
    name: "opencode-msb $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "opencode-msb-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/opencode-msb-linux-amd64"

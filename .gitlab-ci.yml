stages:
  - lint
  - deps
  - test
  - prepare
  - build
  - release

variables:
  CGO_ENABLED: "1"

.go-image:
  image: golang:1.26

.go-cache:
  extends: .go-image
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    paths:
      - .go/pkg/mod/

build-builder-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: never
    - changes:
        - ci/builder/Dockerfile
    - when: manual
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "ci/builder/Dockerfile" --destination "$CI_REGISTRY_IMAGE/ci-builder:latest"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - golangci-lint run ./...

test:
  stage: test
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - go test ./... -v -short

version:
  stage: build
  extends: .go-image
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - VERSION="0.$(date -u +%Y.%-m.%-d)+${CI_COMMIT_SHORT_SHA}"
    - echo "VERSION=$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

build:
  stage: build
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != "release"
  script:
    - go build -o opencode-msb ./cmd/opencode-msb
    - ./opencode-msb --version
  artifacts:
    paths:
      - opencode-msb

.build-release-tmpl:
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-builder:latest
  needs:
    - job: version
      artifacts: true
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    paths:
      - .go/pkg/mod/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  artifacts:
    paths:
      - $ARTIFACT_NAME
    reports:
      dotenv: build.env

build-release:linux-amd64:
  extends: .build-release-tmpl
  variables:
    GOOS: "linux"
    GOARCH: "amd64"
    ZIG_TARGET: "x86_64-linux-gnu"
    ARTIFACT_NAME: "opencode-msb-linux-amd64"
  script:
    - export CC="zig cc -target $ZIG_TARGET"
    - export CXX="zig c++ -target $ZIG_TARGET"
    - CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.version=$VERSION" -o $ARTIFACT_NAME ./cmd/opencode-msb
    - ./opencode-msb-linux-amd64 --version
    - echo "LINUX_AMD64_JOB_ID=${CI_JOB_ID}" >> build.env

build-release:darwin-arm64:
  extends: .build-release-tmpl
  variables:
    GOOS: "darwin"
    GOARCH: "arm64"
    ZIG_TARGET: "aarch64-macos-gnu"
    ARTIFACT_NAME: "opencode-msb-darwin-arm64"
  script:
    - export CC="zig cc -target $ZIG_TARGET"
    - export CXX="zig c++ -target $ZIG_TARGET"
    - CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.version=$VERSION" -o $ARTIFACT_NAME ./cmd/opencode-msb
    - file opencode-msb-darwin-arm64
    - file opencode-msb-darwin-arm64 | grep -q "Mach-O.*arm64"
    - python3 ci/smoke-check-darwin-arm64.py opencode-msb-darwin-arm64
    - go version -m opencode-msb-darwin-arm64
    - echo "DARWIN_ARM64_JOB_ID=${CI_JOB_ID}" >> build.env

# linux/arm64 is SDK-supported (libmicrosandbox_go_ffi-linux-arm64.so is
# embedded) and ready to enable by uncommenting:

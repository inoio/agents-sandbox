stages:
  - prepare
  - lint
  - deps
  - test
  - build
  - release

variables:
  CGO_ENABLED: "1"

default:
  interruptible: true

.go-image:
  image: golang:1.26

.go-cache:
  extends: .go-image
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    paths:
      - .go/pkg/mod/

build-builder-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: manual
    - if: $CI_COMMIT_BRANCH == "release"
      changes:
        - ci/builder/Dockerfile
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "ci/builder/Dockerfile" --destination "$CI_REGISTRY_IMAGE/ci-builder:latest"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - make lint

test:
  stage: test
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - make test

version:
  stage: build
  extends: .go-image
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - VERSION="0.$(date -u +%Y.%-m.%-d)+${CI_COMMIT_SHORT_SHA}"
    - echo "VERSION=$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

build:
  stage: build
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != "release"
  script:
    - go build -o opencode-msb ./cmd/opencode-msb
    - ./opencode-msb version
  artifacts:
    paths:
      - opencode-msb

.build-release-tmpl:
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-builder:latest
  needs:
    - job: version
      artifacts: true
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  script:
    - make build-release GOOS=$GOOS GOARCH=$GOARCH ZIG_TARGET=$ZIG_TARGET VERSION=$VERSION
    - echo "JOB_ID_${GOOS}_${GOARCH}=${CI_JOB_ID}" >> build.env
  before_script:
    - mkdir -p .go
  cache:
    paths:
      - .go/pkg/mod/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  artifacts:
    paths:
      - opencode-msb-$GOOS-$GOARCH
    reports:
      dotenv: build.env

build-release:linux-amd64:
  extends: .build-release-tmpl
  variables:
    GOOS: "linux"
    GOARCH: "amd64"
    ZIG_TARGET: "x86_64-linux-gnu"

build-release:linux-arm64:
  extends: .build-release-tmpl
  variables:
    GOOS: "linux"
    GOARCH: "arm64"
    ZIG_TARGET: "aarch64-linux-gnu"

build-release:darwin-arm64:
  extends: .build-release-tmpl
  variables:
    GOOS: "darwin"
    GOARCH: "arm64"
    ZIG_TARGET: "aarch64-macos.11.0-none"

validate-releases:
  stage: release
  extends: .go-image
  needs:
    - job: build-release:linux-amd64
      artifacts: true
    - job: build-release:linux-arm64
      artifacts: true
    - job: build-release:darwin-arm64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - apt update && apt install -y --no-install-recommends file
    - ./opencode-msb-linux-amd64 version
    - file opencode-msb-linux-arm64 | grep -q "ELF.*ARM.*aarch64"
    - file opencode-msb-darwin-arm64 | grep -q "Mach-O.*arm64"


release:
  stage: release
  interruptible: false
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: version
      artifacts: true
    - job: validate-releases
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - echo "running release_job for $VERSION"
  release:
    name: "opencode-msb $VERSION"
    description: "Release $VERSION"
    tag_name: "$VERSION"
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: "opencode-msb-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/${JOB_ID_linux_amd64}/artifacts/file/opencode-msb-linux-amd64"
          filepath: "/opencode-msb-linux-amd64"
        - name: "opencode-msb-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/${JOB_ID_linux_arm64}/artifacts/file/opencode-msb-linux-arm64"
          filepath: "/opencode-msb-linux-arm64"
        - name: "opencode-msb-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/${JOB_ID_darwin_arm64}/artifacts/file/opencode-msb-darwin-arm64"
          filepath: "/opencode-msb-darwin-arm64"

stages:
  - lint
  - deps
  - test
  - prepare
  - build
  - release

variables:
  CGO_ENABLED: "1"

.go-image:
  image: golang:1.26

.go-cache:
  extends: .go-image
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    paths:
      - .go/pkg/mod/

build-builder-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: never
    - changes:
        - ci/builder/Dockerfile
    - when: manual
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "ci/builder/Dockerfile" --destination "$CI_REGISTRY_IMAGE/ci-builder:latest"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - golangci-lint run ./...

test:
  stage: test
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - go test ./... -v -short

build:
  stage: build
  extends: .go-cache
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != "release"
  script:
    - go build -o opencode-msb ./cmd/opencode-msb
    - ./opencode-msb --version
  artifacts:
    paths:
      - opencode-msb

build-release:
  extends: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - VERSION="0.$(date -u +%Y.%-m.%-d)+${CI_COMMIT_SHORT_SHA}"
    - echo "VERSION=$VERSION" >>version.env
    - echo "BUILD_JOB_ID=${CI_JOB_ID}" >> version.env
    - go build -ldflags "-X main.version=$VERSION" -o opencode-msb-linux-amd64 ./cmd/opencode-msb
    - ./opencode-msb-linux-amd64 --version
  artifacts:
    paths:
      - opencode-msb-linux-amd64
    reports:
      dotenv: version.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - echo "running release_job for $TAG"
  release:
    name: "opencode-msb $VERSION"
    description: "Release $VERSION"
    tag_name: "$VERSION"
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: "opencode-msb-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/file/opencode-msb-linux-amd64"
          filepath: "/opencode-msb-linux-amd64"
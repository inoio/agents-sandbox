stages:
  - lint
  - test
  - build
  - release

variables:
  CGO_ENABLED: "1"

lint:
  stage: lint
  image: golang:1.26
  script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  script:
    - go mod download
    - go test ./... -v

build:
  stage: build
  image: golang:1.26
  script:
    - go mod download
    - go build -o opencode-msb ./cmd/opencode-msb
    - ./opencode-msb --version
  artifacts:
    paths:
      - opencode-msb

prepare-release:
  stage: build
  image: golang:1.26
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - VERSION="0.$(date -u +%Y.%-m.%-d)+${CI_COMMIT_SHORT_SHA}"
    - echo "VERSION=$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

release:
  stage: release
  image: golang:1.26
  needs:
    - prepare-release
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
  script:
    - go mod download
    - go build -ldflags "-X main.version=$VERSION" -o opencode-msb-linux-amd64 ./cmd/opencode-msb
    - ./opencode-msb-linux-amd64 --version
  artifacts:
    paths:
      - opencode-msb-linux-amd64
  release:
    name: "opencode-msb $VERSION"
    description: "Release $VERSION"
    tag_name: "$VERSION"
    assets:
      links:
        - name: "opencode-msb-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/opencode-msb-linux-amd64"

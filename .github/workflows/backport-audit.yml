name: backport-audit

# Every fix lands on the default branch and is cherry-picked onto the newest
# release/<major>.<minor> line. This workflow reconciles the two: it reports a
# merged `needs-backport` pull request whose commits never reached the release
# line, opens the missing backport pull requests, and keeps its pinned
# `[Tracker] Missing backports` issue current. It is deliberately not a gate — a nightly schedule and a manual
# dispatch only, never a PR check and never a member of `release.needs` — so a
# forgotten port is surfaced, never enforced: a red run here reports debt and
# blocks nothing.
#
# The detector (`scripts/backport-audit.sh`) and the porter
# (`scripts/open-backport-pr.sh`) apply the grace period and the already-open-
# backport-PR noise rule themselves; this workflow only sequences them and
# reports.
on:
  schedule:
    # Nightly, from the default branch only, on a slot clear of the fuzz
    # (`17 3 * * *`) and ci (`43 2 * * *`) schedules.
    - cron: "23 4 * * *"
  workflow_dispatch:

# Least privilege by default; the audit job raises this for itself, since it
# pushes a backport branch, opens pull requests, and maintains the pinned
# tracker issue. A job-level `permissions` block replaces this one rather than merging
# with it, so the job repeats `contents` at the wider scope it needs.
permissions:
  contents: read

# One audit at a time. A manual dispatch racing the nightly would otherwise run
# two audits that each create a "[Tracker] Missing backports" issue, breaking the one-tracker
# invariant. Never cancel a run in progress — it may be mid-way through
# opening backport pull requests — so a superseded pending run is dropped and
# the running one finishes (mirrors fuzz.yml).
concurrency:
  group: backport-audit
  cancel-in-progress: false

jobs:
  audit:
    name: backport audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    env:
      # `gh` reads GH_TOKEN; the default token is enough for the audit's reads
      # and the job's writes.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit resolves the newest release branch and walks the merge
          # commits of the labeled pull requests, so it needs the full history,
          # not the single checked-out branch.
          fetch-depth: 0
      - name: Fetch the release branches
        # A full-history checkout still leaves the release branches to the local
        # resolver only when their refs exist; fetch them explicitly.
        run: git fetch --prune origin '+refs/heads/release/*:refs/remotes/origin/release/*'
      - name: Detect the backport debt
        # The detector owns the status semantics: 0 clean, 1 debt found, and any
        # other non-zero a usage or operational failure (a `gh`/`git` rate limit
        # or network blip aborts it mid-run). Only a 0 is clean. A failure must
        # not read as "no debt" — that would let the next step close the tracker
        # and erase the signal — so it fails this step instead: non-gating
        # (a scheduled failure blocks nothing), but the steps below are skipped
        # and the issue is left as it was. `backport-debt.txt` holds only debt
        # lines; the detector also prints a plain sentence when there is no
        # release branch at all.
        run: |
          status=0
          scripts/backport-audit.sh > backport-audit-raw.txt 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            : > backport-debt.txt
            exit 0
          fi
          if [ "$status" -ne 1 ]; then
            echo "backport-audit: the detector exited ${status} (neither clean nor debt); leaving the tracker untouched." >&2
            cat backport-audit-raw.txt >&2
            exit "$status"
          fi
          if ! grep -E '^#[0-9]+' backport-audit-raw.txt > backport-debt.txt; then
            echo "backport-audit: the detector reported debt but printed no debt line; refusing to treat it as clean." >&2
            cat backport-audit-raw.txt >&2
            exit 1
          fi
      - name: Ensure the missing-backports tracker
        # The tracker must exist before the porter runs so each backport PR can
        # reference it as "Part of #<n>". It is found by exact title (GitHub
        # tokenizes "[Tracker]" away, so a title search's first hit is not
        # trustworthy), created when debt appears, and pinned to the top of the
        # issue list. A later run that finds no debt closes and unpins it, so it
        # is not a permanent always-open issue.
        run: |
          if [ ! -s backport-debt.txt ]; then
            echo "No backport debt; no tracker needed."
            exit 0
          fi
          tracker="$(gh issue list --state open --json number,title --limit 5000 \
            --jq '[.[] | select(.title == "[Tracker] Missing backports")][0].number // empty')"
          if [ -z "$tracker" ]; then
            tracker_url="$(gh issue create --title "[Tracker] Missing backports" \
              --body "Tracking \`needs-backport\` fixes not yet on the maintained release line; maintained by the nightly backport audit.")"
            tracker="${tracker_url##*/}"
          fi
          echo "TRACKER=${tracker}" >> "$GITHUB_ENV"
          tracker_id="$(gh issue view "$tracker" --json id --jq .id)"
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          pinned="$(gh api graphql \
            -f query="query(\$o:String!,\$n:String!){repository(owner:\$o,name:\$n){pinnedIssues(first:3){nodes{issue{number}}}}}" \
            -f o="$owner" -f n="$name" \
            --jq '.data.repository.pinnedIssues.nodes[].issue.number' 2>/dev/null || true)"
          if printf '%s\n' "$pinned" | grep -qx "$tracker"; then
            echo "The tracker (#${tracker}) is already pinned."
          elif gh api graphql -f query="mutation(\$id:ID!){pinIssue(input:{issueId:\$id}){issue{number}}}" -f id="$tracker_id" >/dev/null; then
            echo "Pinned the tracker (#${tracker})."
          else
            echo "::warning::could not pin the tracker (#${tracker}); leaving it unpinned"
          fi
      - name: Open the missing backport pull requests
        # Not a gate: a conflict (the porter aborts without pushing) is logged
        # and left in the tracker rather than failing the run, and one port never
        # blocks the next.
        #
        # The porter's status decides the message: 0 means the branch was pushed
        # and the PR opened, 3 means every source commit is already on the line
        # so nothing was opened, 1 means it could not port (conflict, unknown or
        # unmerged PR, no release branch), 4 means the PR opened but its fragment
        # could not be renamed (it fails the changelog slug check). Any other
        # status is unexpected and is logged as a failure too, never as an
        # opened PR.
        #
        # A finding that already has an open backport PR is not re-ported: its
        # branch and PR exist, so the tracker lists it and waits for a merge.
        #
        # A pull request this step opens is authored by GITHUB_TOKEN, so its own
        # workflow run parks at `action_required` until a maintainer approves
        # it. That is expected, not a bug.
        run: |
          if [ ! -s backport-debt.txt ]; then
            echo "No backport debt; nothing to port."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r number title _ _ open_pr; do
            [ -n "$number" ] || continue
            pr="${number#\#}"
            open_ref="${open_pr#open:}"
            if [ -n "$open_ref" ]; then
              echo "Skipping ${number}: ${open_ref} is already open."
              continue
            fi
            echo "::group::Porting ${number} (${title})"
            status=0
            BACKPORT_TRACKER_ISSUE="${TRACKER:-}" scripts/open-backport-pr.sh "$pr" || status=$?
            case "$status" in
              0) echo "Opened the backport pull request for ${number}." ;;
              3) echo "The fix in ${number} is already fully ported onto the release branch; nothing was opened." ;;
              4) echo "Opened a pull request for ${number} but could not rename its fragment; it stays in the tracker." ;;
              1) echo "Could not open a backport pull request for ${number}; it stays in the tracker." ;;
              *) echo "Backporting ${number} failed with an unexpected status (${status}); it stays in the tracker." ;;
            esac
            echo "::endgroup::"
          done < backport-debt.txt
      - name: Update the missing-backports tracker
        # Reached only when the detect step confirmed a result (clean or debt):
        # an operational failure fails that step and skips this one, so a
        # transient blip can never close the tracker. One open issue titled
        # "[Tracker] Missing backports" mirrors the current audit: its body is
        # rewritten from this run's output, it is unpinned and closed once the
        # debt clears, and it is created when it reopens.
        run: |
          tracker="$(gh issue list --state open --json number,title --limit 5000 \
            --jq '[.[] | select(.title == "[Tracker] Missing backports")][0].number // empty')"
          if [ ! -s backport-debt.txt ]; then
            if [ -n "$tracker" ]; then
              tracker_id="$(gh issue view "$tracker" --json id --jq .id)"
              gh api graphql -f query="mutation(\$id:ID!){unpinIssue(input:{issueId:\$id}){issue{number}}}" -f id="$tracker_id" >/dev/null \
                || echo "::warning::could not unpin the tracker (#${tracker})"
              gh issue close "$tracker" --comment "The nightly backport audit found no outstanding debt."
              echo "Closed the tracker (#${tracker})."
            else
              echo "No backport debt and no open tracker."
            fi
            exit 0
          fi
          {
            echo "Merged \`needs-backport\` fixes whose commits are missing from the latest \`release/<major>.<minor>\` line, as detected by the nightly [\`backport-audit\`](${{ github.server_url }}/${{ github.repository }}/actions/workflows/backport-audit.yml) run."
            echo
            echo "| Pull request | Title | Missing commits | In flight |"
            echo "| --- | --- | --- | --- |"
            while IFS=$'\t' read -r number title url missing open_pr; do
              [ -n "$number" ] || continue
              open_ref="${open_pr#open:}"
              if [ -n "$open_ref" ]; then
                in_flight="[open](${open_ref}) — merge or close it"
              else
                in_flight="—"
              fi
              printf '| [%s](%s) | %s | %s | %s |\n' "$number" "$url" "${title//|/\\|}" "${missing#missing:}" "$in_flight"
            done < backport-debt.txt
            echo
            echo "_This issue is maintained by the \`backport-audit\` workflow; its body is rewritten on every run._"
          } > backport-debt-issue.md
          if [ -n "$tracker" ]; then
            gh issue edit "$tracker" --body-file backport-debt-issue.md
            echo "Updated the tracker (#${tracker})."
          else
            gh issue create --title "[Tracker] Missing backports" --body-file backport-debt-issue.md
          fi

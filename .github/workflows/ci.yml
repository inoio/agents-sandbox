name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # `labeled` opts a PR into the opt-in podman integration job via the
    # `run-integration-podman` label; the other three are the default
    # pull_request types. The docker `integration` job no longer needs a label
    # — it runs on every code-affecting PR.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue re-runs the required checks on the temporary
  # `gh-readonly-queue/main/...` ref, which holds `main` plus the queued PRs.
  # Without this trigger the required checks never report there, so every
  # queue entry waits out the check-response timeout and is dropped.
  merge_group:
  workflow_dispatch:

# Least privilege for every job. The release pipeline's `publish` job raises this
# for itself (contents + pull-requests write, to publish the Release and open the
# Homebrew bump PR).
permissions:
  contents: read

# A re-pushed PR cancels its superseded run: the newest commit is the one worth
# checking, and the required checks re-report on it. Non-PR events (main pushes,
# tags, dispatch, merge groups) each get a unique group via the run id, so they
# are never cancelled or serialized — a burst of merges to main all still run,
# and a rebuilt queue ref is a fresh run rather than a cancellation.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a push to main changed anything that can affect the runner image or
  # the tests. The costly integration jobs gate on this so a docs- or
  # brain-only merge to main does not pay a ~16-minute image build. It always
  # runs, so its output is available to every gated job on every event.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect code-affecting changes
        id: filter
        run: |
          set -euo pipefail
          # A push carries the previous tip in `before`. A pull_request payload
          # has no `before`, so diff against the base branch's merge base, which
          # is exactly the PR's changeset. A merge_group names its base directly,
          # since its ref is the throwaway `gh-readonly-queue/...` branch.
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base=$(git merge-base "origin/${{ github.base_ref }}" '${{ github.sha }}')
          elif [ '${{ github.event_name }}' = 'merge_group' ]; then
            base='${{ github.event.merge_group.base_sha }}'
          else
            base='${{ github.event.before }}'
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base='HEAD^'; fi
          fi
          files=$(git diff --name-only "$base" '${{ github.sha }}' || true)
          # The complement of mutation.yml's paths-ignore: docs, the operator
          # brain, the Homebrew formula, issue templates, and .gitignore.
          if printf '%s\n' "$files" | grep -vqE '^(docs/|\.operator-shared/|Formula/|\.github/ISSUE_TEMPLATE/)|\.md$|^\.gitignore$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Required check. It always runs — a gated required check reports Success
  # without running — and decides the changelog presence rule from the diff.
  # The base computation mirrors the `changes` job above.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute changed files
        run: |
          set -euo pipefail
          base=""
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
            base=$(git merge-base "origin/${{ github.base_ref }}" '${{ github.sha }}' || true)
          elif [ '${{ github.event_name }}' = 'merge_group' ]; then
            base='${{ github.event.merge_group.base_sha }}'
          else
            base='${{ github.event.before }}'
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base='HEAD^'; fi
          fi
          # An undecidable base degrades to shape-only rather than failing this
          # required check: a transient fetch failure must not eject a PR.
          git diff --name-only "$base" '${{ github.sha }}' > /tmp/changed.txt 2>/dev/null || true
      - name: Check fragments
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            ci/check-changelog.sh . --changed /tmp/changed.txt --pr "$PR_NUMBER"
          else
            ci/check-changelog.sh . --changed /tmp/changed.txt
          fi
      - name: Test the fragment checker
        run: make changelog-check-test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          # Include the integration, msb, and microsandbox_ffi_path build-tagged
          # files, which the default build constraints otherwise omit. Keep in
          # sync with the Makefile `lint` target.
          args: --build-tags "integration msb microsandbox_ffi_path" ./...
      # Compile every package including build-tagged files (`integration`) so a
      # tagged-only compile regression fails on PRs, not just on main/releases.
      - run: make compile-all
      - run: make validate-fmt
      - run: make docs-linkcheck
      - run: make docs-linkcheck-test
      - run: make cleanup-branches-test
      - run: make envelope-test
      - run: make upstream-drift-test
      - run: make rebase-status-test

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make coverage-junit
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  race:
    name: race
    # A required check (see the `protect main` ruleset), so it is not gated and
    # runs on every event. GitHub reports a job skipped by its `if` as Success,
    # which would satisfy the required check without running it — a gated
    # required check can go green untested. It runs in parallel with lint/test,
    # so always-on costs the queue no extra wall-clock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make test-race

  vulncheck:
    name: vulncheck
    # Not a required check; skipped on a code-free change, and never run on a
    # merge group — a network-dependent red must not appear on the queue's
    # throwaway ref, where it could only be noise.
    needs: [changes]
    if: >-
      github.event_name != 'merge_group' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make vulncheck

  deadcode:
    name: deadcode
    # A required check (see the `protect main` ruleset), so it always runs, like
    # race.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make deadcode

  integration:
    name: integration (docker build)
    # A required check (see the `protect main` ruleset). Runs on a code-affecting
    # PR (the `changes` gate skips a docs/brain-only one), a code-affecting push
    # to main, every release tag, and manual dispatch. It deliberately does not
    # run on a merge group: GitHub reports a skipped required check as Success,
    # so the queue satisfies the requirement without paying the build, and the
    # post-merge push to main is what runs and re-seeds the cache.
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true')
    env:
      # main and a release tag are the validation runs: they build the image
      # from scratch and (main only) export the cache, so a green main proves
      # the build works uncached. Every other run — a PR, a dispatch —
      # restores from main's export but never writes a merge-ref cache. Each
      # value is one BuildKit cache spec, forwarded verbatim (see the
      # integration suite's imageCacheEnv helper). The launcher fills the
      # cache-service url and token from the ACTIONS_* environment the
      # `ghaction-github-runtime` step exposes.
      AGENTS_SANDBOX_IMAGE_CACHE_FROM: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && 'type=gha,scope=runner-image' || '' }}
      AGENTS_SANDBOX_IMAGE_CACHE_TO: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=runner-image,mode=max' || '' }}
      # The integration suite writes the steps each build served from the
      # imported cache here (a passing `go test` otherwise swallows the
      # streamed output), and the job prints it afterwards. Without it a silent
      # cache miss is indistinguishable from a hit.
      AGENTS_SANDBOX_CACHE_REPORT: ${{ github.workspace }}/runner-image-cache-report.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      # GitHub does not put the Actions cache-service url/token into a plain
      # `run` step's environment; this exposes them so the launcher can carry
      # them to the daemon's BuildKit (which cannot read the step's env).
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: make test-integration
      - name: Runner-image build cache report
        if: always()
        run: cat "$AGENTS_SANDBOX_CACHE_REPORT" 2>/dev/null || echo "no cache report"

  integration-podman:
    name: integration (podman build)
    # The same full-image build as `integration`, against a rootless podman
    # endpoint instead of Docker Engine: podman serves the Docker API, so it is
    # expected to work, and this job is what makes it a tested engine. Its own
    # opt-in label keeps a podman-only failure from blocking a PR a maintainer
    # ran docker for. Gated by `changes` on a main push like `integration`.
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-integration-podman')) ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    env:
      # Run the suite serially on podman. Buildah has a race between concurrent
      # --layers builds and rmi that corrupts the layer store ("checking if
      # cached image exists from a previous build: getting top layer info: layer
      # not known", buildah#5674), which the image integration tests trigger with
      # their parallel builds plus per-subtest rmi. No apt-provided podman on the
      # runner avoids it, so serialize; the timeout gives the serialized image
      # binary headroom over the 60m default.
      INTEGRATION_PARALLEL: "1"
      INTEGRATION_TIMEOUT: 120m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Serve the podman Docker API and point DOCKER_HOST at it
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap fuse-overlayfs slirp4netns
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$runtime_dir/podman"
          export DOCKER_HOST="unix://$runtime_dir/podman/podman.sock"
          podman system service --time=0 "$DOCKER_HOST" &
          for _ in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker info
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
      - run: make test-integration

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, integration, integration-podman]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
          - target: linux-arm64
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            zig_target: aarch64-macos.11.0-none
    steps:
      - uses: actions/checkout@v7

      - name: Install zig
        run: |
          ZIG_VERSION=0.17.1
          TARBALL=zig-x86_64-linux-${ZIG_VERSION}.tar.xz
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "/tmp/${TARBALL}"
          tar -xf "/tmp/${TARBALL}" -C /opt
          rm "/tmp/${TARBALL}"
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Bake macOS linker stubs into zig libc
        if: matrix.goos == 'darwin'
        run: |
          ZIG_ROOT="$(dirname "$(command -v zig)")"
          DARWIN="$ZIG_ROOT/lib/libc/darwin"
          mkdir -p "$DARWIN/System/Library/Frameworks/CoreFoundation.framework"
          mkdir -p "$DARWIN/System/Library/Frameworks/Security.framework"
          mkdir -p "$DARWIN/usr/lib"
          cp .github/stubs/CoreFoundation.tbd "$DARWIN/System/Library/Frameworks/CoreFoundation.framework/"
          cp .github/stubs/Security.tbd      "$DARWIN/System/Library/Frameworks/Security.framework/"
          cp .github/stubs/libresolv.tbd     "$DARWIN/usr/lib/"

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - name: Resolve bare version
        run: |
          echo "BARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: make build-release VERSION="${BARE_VERSION}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ZIG_TARGET: ${{ matrix.zig_target }}

      - name: Validate binary
        run: |
          f="agents-sandbox-${{ matrix.target }}"
          test -s "$f"
          # Verify the correct executable format per target via magic header.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "7f454c46" ]   # \x7fELF
          else
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "cffaedfe" ]   # Mach-O 64
          fi
          # Native execution smoke test only where the runner arch matches.
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            ./"$f" version
          fi
          file "$f"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agents-sandbox-${{ matrix.target }}
          path: agents-sandbox-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Classify release tag
        run: |
          set -euo pipefail
          # Release tags are v<semver> (the workflow triggers on v*). Build
          # metadata (a `+...` suffix) does not affect precedence, so drop it
          # before looking for the prerelease hyphen: v1.9.0+build-42 is a final
          # release whose metadata happens to contain a hyphen. A prerelease
          # must not be served by /releases/latest (the stable channel's only
          # source of truth) and must not bump the Homebrew formula (the tap
          # serves full releases only).
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          if [[ "$version" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          # One sha256sum-format line per release asset, keyed on the flat asset
          # name the updater looks up: `<64-hex><two spaces><asset-name>`.
          cd artifacts
          : > checksums.txt
          for asset in agents-sandbox-*/agents-sandbox-*; do
            sha="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$sha" "$(basename "$asset")"
          done >> checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "agents-sandbox ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            artifacts/*/*
            artifacts/checksums.txt

      - name: Bump Homebrew formula
        if: env.IS_PRERELEASE != 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -E -i "s|(releases/download/)v[0-9][^/]*/|\1v${version}/|g" Formula/agents-sandbox.rb
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            sha="$(sha256sum "artifacts/agents-sandbox-${target}/agents-sandbox-${target}" | cut -d' ' -f1)"
            awk -v target="$target" -v sha="$sha" '
              index($0, target) { pending = 1 }
              pending && /sha256/ { sub(/sha256 "[0-9a-f]*"/, "sha256 \"" sha "\""); pending = 0 }
              { print }
            ' Formula/agents-sandbox.rb > Formula/agents-sandbox.rb.tmp
            mv Formula/agents-sandbox.rb.tmp Formula/agents-sandbox.rb
          done
          git --no-pager diff Formula/agents-sandbox.rb

      - name: Open Homebrew formula bump PR
        if: env.IS_PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/agents-sandbox.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          branch="chore/homebrew-formula-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(release): bump Homebrew formula to ${VERSION}" Formula/agents-sandbox.rb
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): bump Homebrew formula to ${VERSION}" \
            --body "Automated bump of \`Formula/agents-sandbox.rb\` to ${VERSION} so Homebrew installs stay current (see #66). The force-push above refreshed any still-open bump PR." \
            || echo "An open bump PR already exists; it was updated by the force-push."
          gh pr merge --auto --squash "$branch" \
            || echo "Auto-merge not available for this repo; merge the bump PR manually."

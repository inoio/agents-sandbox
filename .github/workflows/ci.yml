name: ci

on:
  push:
    branches: [main, 'release/*']
    tags: ["v*"]
  pull_request:
    # `labeled` opts a PR into the opt-in podman integration job via the
    # `run-integration-podman` label; the other three are the default
    # pull_request types. The docker `integration` job no longer needs a label
    # — it runs on every code-affecting PR.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue re-runs the required checks on the temporary
  # `gh-readonly-queue/main/...` ref, which holds `main` plus the queued PRs.
  # Without this trigger the required checks never report there, so every
  # queue entry waits out the check-response timeout and is dropped.
  merge_group:
  workflow_dispatch:
  schedule:
    # The cold-image and podman validations, off the merge path. Runs from the
    # default branch only.
    - cron: "43 2 * * *"

# Least privilege for every job. The release pipeline's `publish` job raises this
# for itself (contents + pull-requests write, to publish the Release and open the
# Homebrew bump PR).
permissions:
  contents: read

# A re-pushed PR cancels its superseded run: the newest commit is the one worth
# checking, and the required checks re-report on it. Non-PR events (main pushes,
# tags, dispatch, merge groups) each get a unique group via the run id, so they
# are never cancelled or serialized — a burst of merges to main all still run,
# and a rebuilt queue ref is a fresh run rather than a cancellation.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a push to main changed anything that can affect the runner image or
  # the tests. The costly integration jobs gate on this so a docs- or
  # brain-only merge to main does not pay a ~16-minute image build. It runs on
  # every event except a merge group: each consumer declares `needs: [changes]`
  # with `!cancelled()` and forces its step gate open on a merge group, so a
  # skipped dependency does not skip them, and the queue skips the checkout and
  # diff without dropping a required job.
  changes:
    name: changes
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      exec: ${{ steps.filter.outputs.exec }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the changeset
        id: filter
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          code=false
          exec=false
          if base=$(ci/event-base.sh) && files=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            # The `code` set is the complement of mutation.yml/codeql.yml's paths-ignore and
            # check-changelog.sh's presence rule; keep the four copies in sync
            # (ci/check-ci-guards.sh).
            if printf '%s\n' "$files" | grep -vqE '^(docs/|\.operator-shared/|Formula/|\.github/ISSUE_TEMPLATE/|\.agents-sandbox/)|\.md$|^\.gitignore$'; then
              code=true
            fi
            # `exec` is `code` with docs/** removed: a docs/ path is inert for the image build
            # but not for the Go jobs (a default-suite test reads docs/configuration/networking.md).
            if [ "$code" = true ] || printf '%s\n' "$files" | grep -qE '^docs/'; then
              exec=true
            fi
          else
            # Fail closed: an undecidable base or a failed diff runs everything.
            code=true
            exec=true
          fi
          # A release tag always runs the full set: a force-updated tag can carry
          # a resolvable `before`, and no release may skip a required check's work.
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            code=true
            exec=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "exec=$exec" >> "$GITHUB_OUTPUT"

  # Required check. It always runs — a gated required check reports Success
  # without running — and decides the changelog presence rule from the diff.
  # An undecidable base degrades to shape-only rather than failing this required
  # check: a transient fetch failure must not eject a PR.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute changed files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base=$(ci/event-base.sh || true)
          git diff --name-only "${base:-}" "$GITHUB_SHA" > /tmp/changed.txt 2>/dev/null || true
      - name: Check fragments
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            ci/check-changelog.sh . --changed /tmp/changed.txt --pr "$PR_NUMBER"
          else
            ci/check-changelog.sh . --changed /tmp/changed.txt
          fi
      - name: Test the fragment checker
        run: make changelog-check-test

  lint:
    name: lint
    # A required check, so it always runs: `!cancelled()` (not a bare
    # `success()`) keeps it running when the `changes` dependency was skipped on
    # a merge group. The Go-toolchain steps below skip when the changeset is
    # execution-inert (`changes.outputs.exec == 'false'`), but the doc- and
    # script-gates still run — a docs-only or shell-only change is exactly what
    # they cover.
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@v9
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}
        with:
          version: v2.15
          # Include the integration, msb, and microsandbox_ffi_path build-tagged
          # files, which the default build constraints otherwise omit. Keep in
          # sync with the Makefile `lint` target.
          args: --build-tags "integration msb microsandbox_ffi_path" ./...
      # Compile every package including build-tagged files (`integration`) so a
      # tagged-only compile regression fails on PRs, not just on main/releases.
      - run: make compile-all
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}
      - run: make validate-fmt
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}
      - run: make docs-linkcheck
      - run: make docs-linkcheck-test
      - run: make ci-guards-check
      - run: make ci-guards-check-test
      - run: make actionlint
      - run: make cleanup-branches-test
      - run: make envelope-test
      - run: make upstream-drift-test
      - run: make rebase-status-test

  test:
    name: test
    # Required check; see `lint` for why the job itself is `!cancelled()` and its
    # Go-toolchain step skips on an execution-inert changeset. The second Codecov
    # step's `!cancelled()` is composed with the gate, not replaced by it.
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make coverage-junit
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}
      - uses: codecov/codecov-action@v7
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false') }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  race:
    name: race
    # A required check (see the `protect main` ruleset), so the job always runs —
    # a gated required check reports Success without running it. Only its body
    # step is gated by the `changes` `exec` output, so an execution-inert
    # changeset pays the checkout but not the race suite. It runs in parallel
    # with lint/test, so the always-on job costs the queue no extra wall-clock.
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make test-race
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}

  vulncheck:
    name: vulncheck
    # Not a required check; skipped on a code-free change, and never run on a
    # merge group — a network-dependent red must not appear on the queue's
    # throwaway ref, where it could only be noise.
    needs: [changes]
    if: >-
      !cancelled() &&
      github.event_name != 'merge_group' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make vulncheck

  deadcode:
    name: deadcode
    # A required check (see the `protect main` ruleset), so the job always runs,
    # like race. Only its body step is gated by the `changes` `exec` output, so
    # an execution-inert changeset pays the checkout but not the analysis.
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make deadcode
        if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.exec != 'false' }}

  integration:
    name: integration (docker build)
    # A required check (see the `protect main` ruleset). Runs on a code-affecting
    # PR (the `changes` gate skips a docs/brain-only one), every release tag,
    # a push to a release branch, and manual dispatch — the read-only readers.
    # The code-affecting push to main is the write-capable
    # `integration-cache-writer` below. It deliberately does not run on a merge
    # group: GitHub reports a skipped required check as Success, so
    # the queue satisfies the requirement without paying the build.
    #
    # `packages: read` is least privilege: a reader only pulls the cache, so the
    # `docker login` credential it saves cannot push to the shared package even
    # when a test dependency is compromised. Only the writer job may write.
    #
    # The release-push arm carries the same `code` gate as the main push's build:
    # a docs-only release push skips a build, while the release *tag* push (the
    # clause above) always builds uncached, so a release is never left unbuilt.
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && needs.changes.outputs.code != 'false') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code != 'false'))
    permissions:
      contents: read
      packages: read
    env:
      # Authenticate the release-resolution queries the image build tests make
      # to api.github.com, so the shared runner IP is not subject to the
      # anonymous 60-requests/hour limit (see internal/agent/latest.go).
      GH_TOKEN: ${{ github.token }}
      # The runner-image BuildKit cache lives in GHCR, which has no Actions
      # cache-budget cap. This reader job only imports it; `integration-cache-writer`
      # is the single writer. The suite keys each build's ref tag per build
      # (keyCacheSpec), so sibling builds cannot clobber one shared tag.
      # Credentials reach the daemon's BuildKit through the session, from the
      # `docker login` step below.
      #
      # A fork PR gets a read-only token with no `packages` scope: it cannot log
      # in, and an anonymous pull of the private package is a 403 that fails the
      # build, so it imports nothing and builds uncached instead.
      AGENTS_SANDBOX_IMAGE_CACHE_FROM: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/inoio/agents-sandbox:buildcache' || '' }}
      AGENTS_SANDBOX_IMAGE_CACHE_TO: ''
      # The integration suite writes the steps each build served from the
      # imported cache here (a passing `go test` otherwise swallows the
      # streamed output), and the job prints it afterwards. Without it a silent
      # cache miss is indistinguishable from a hit.
      AGENTS_SANDBOX_CACHE_REPORT: ${{ github.workspace }}/runner-image-cache-report.txt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Log in to GHCR for the registry build cache
        # Matches the empty `AGENTS_SANDBOX_IMAGE_CACHE_FROM` a fork PR gets: its
        # read-only token has no `packages` scope, so a login would fail here.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: make test-integration
      - name: Runner-image build cache report
        if: always()
        run: cat "$AGENTS_SANDBOX_CACHE_REPORT" 2>/dev/null || echo "no cache report"

  integration-cache-writer:
    name: integration (docker build, cache writer)
    # The single writer of the GHCR build cache: a code-affecting main push
    # imports the previous chain and re-exports only the changed layers; the cold
    # build is proven by the scheduled `integration-fresh` job and the release
    # tag. It is a separate job so
    # `packages: write` is confined here — a PR, tag, or dispatch run gets the
    # read-only `integration` job above and cannot overwrite the shared cache.
    # This job carries the main push's build; the required
    # `integration (docker build)` context reports Success-on-skip there.
    needs: [changes]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code != 'false'
    permissions:
      contents: read
      packages: write
    env:
      # Authenticate the release-resolution queries the image build tests make
      # to api.github.com, so the shared runner IP is not subject to the
      # anonymous 60-requests/hour limit (see internal/agent/latest.go).
      GH_TOKEN: ${{ github.token }}
      # The runner-image BuildKit cache lives in GHCR, which has no Actions
      # cache-budget cap. This job is the single writer: a main push imports the
      # previous chain, then re-exports only the layers the build changed. A cold
      # from-scratch build is validated by `integration-fresh` and the release
      # tag. The suite keys each build's ref tag per build (keyCacheSpec), so
      # sibling builds cannot clobber one shared tag. Credentials reach the
      # daemon's BuildKit through the session, from the `docker login` step below.
      AGENTS_SANDBOX_IMAGE_CACHE_FROM: 'type=registry,ref=ghcr.io/inoio/agents-sandbox:buildcache'
      AGENTS_SANDBOX_IMAGE_CACHE_TO: 'type=registry,ref=ghcr.io/inoio/agents-sandbox:buildcache,mode=max'
      # The integration suite writes the steps each build served from the
      # imported cache here (a passing `go test` otherwise swallows the
      # streamed output), and the job prints it afterwards. Without it a silent
      # cache miss is indistinguishable from a hit.
      AGENTS_SANDBOX_CACHE_REPORT: ${{ github.workspace }}/runner-image-cache-report.txt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Log in to GHCR for the registry build cache
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: make test-integration
      - name: Runner-image build cache report
        if: always()
        run: cat "$AGENTS_SANDBOX_CACHE_REPORT" 2>/dev/null || echo "no cache report"

  integration-fresh:
    name: integration (docker build, fresh)
    # A scheduled cold build: no cache, so it proves the runner image builds from
    # scratch against today's upstream agent releases. It exports nothing, so it
    # cannot race the writer's cache tag.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTS_SANDBOX_IMAGE_CACHE_FROM: ''
      AGENTS_SANDBOX_IMAGE_CACHE_TO: ''
      AGENTS_SANDBOX_CACHE_REPORT: ${{ github.workspace }}/runner-image-cache-report.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make test-integration
      - name: Runner-image build cache report
        if: always()
        run: cat "$AGENTS_SANDBOX_CACHE_REPORT" 2>/dev/null || echo "no cache report"

  integration-podman:
    name: integration (podman build)
    # The same full-image build as `integration`, against a rootless podman
    # endpoint instead of Docker Engine: podman serves the Docker API, so it is
    # expected to work, and this job is what makes it a tested engine. Its own
    # opt-in label keeps a podman-only failure from blocking a PR a maintainer
    # ran docker for. It no longer runs on a main push — the nightly schedule
    # covers the engine validation off the merge path — and it stays in
    # `release.needs` so a tag still gates the release on it (GitHub has no
    # cross-workflow `needs`).
    needs: [changes]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-integration-podman')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      # Run the suite serially on podman. Buildah has a race between concurrent
      # --layers builds and rmi that corrupts the layer store ("checking if
      # cached image exists from a previous build: getting top layer info: layer
      # not known", buildah#5674), which the image integration tests trigger with
      # their parallel builds plus per-subtest rmi. No apt-provided podman on the
      # runner avoids it, so serialize. The 45m test-level timeout is >3x the
      # observed 14m serialized run and less than the job's 60m timeout, so a
      # hung run is bounded by the job rather than the suite.
      INTEGRATION_PARALLEL: "1"
      INTEGRATION_TIMEOUT: 45m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Serve the podman Docker API and point DOCKER_HOST at it
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap fuse-overlayfs slirp4netns
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$runtime_dir/podman"
          export DOCKER_HOST="unix://$runtime_dir/podman/podman.sock"
          podman system service --time=0 "$DOCKER_HOST" &
          for _ in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker info
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
      - run: make test-integration

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, integration, integration-podman]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
          - target: linux-arm64
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            zig_target: aarch64-macos.11.0-none
    steps:
      - uses: actions/checkout@v7

      - name: Install zig
        run: |
          ZIG_VERSION=0.17.1
          TARBALL=zig-x86_64-linux-${ZIG_VERSION}.tar.xz
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "/tmp/${TARBALL}"
          tar -xf "/tmp/${TARBALL}" -C /opt
          rm "/tmp/${TARBALL}"
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Bake macOS linker stubs into zig libc
        if: matrix.goos == 'darwin'
        run: |
          ZIG_ROOT="$(dirname "$(command -v zig)")"
          DARWIN="$ZIG_ROOT/lib/libc/darwin"
          mkdir -p "$DARWIN/System/Library/Frameworks/CoreFoundation.framework"
          mkdir -p "$DARWIN/System/Library/Frameworks/Security.framework"
          mkdir -p "$DARWIN/usr/lib"
          cp .github/stubs/CoreFoundation.tbd "$DARWIN/System/Library/Frameworks/CoreFoundation.framework/"
          cp .github/stubs/Security.tbd      "$DARWIN/System/Library/Frameworks/Security.framework/"
          cp .github/stubs/libresolv.tbd     "$DARWIN/usr/lib/"

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - name: Resolve bare version
        run: |
          echo "BARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: make build-release VERSION="${BARE_VERSION}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ZIG_TARGET: ${{ matrix.zig_target }}

      - name: Validate binary
        run: |
          f="agents-sandbox-${{ matrix.target }}"
          test -s "$f"
          # Verify the correct executable format per target via magic header.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "7f454c46" ]   # \x7fELF
          else
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "cffaedfe" ]   # Mach-O 64
          fi
          # Native execution smoke test only where the runner arch matches.
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            ./"$f" version
          fi
          file "$f"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agents-sandbox-${{ matrix.target }}
          path: agents-sandbox-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Classify release tag
        run: |
          set -euo pipefail
          # Release tags are v<semver> (the workflow triggers on v*). Build
          # metadata (a `+...` suffix) does not affect precedence, so drop it
          # before looking for the prerelease hyphen: v1.9.0+build-42 is a final
          # release whose metadata happens to contain a hyphen. A prerelease
          # must not be served by /releases/latest (the stable channel's only
          # source of truth) and must not bump the Homebrew formula (the tap
          # serves full releases only).
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          if [[ "$version" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          # One sha256sum-format line per release asset, keyed on the flat asset
          # name the updater looks up: `<64-hex><two spaces><asset-name>`.
          cd artifacts
          : > checksums.txt
          for asset in agents-sandbox-*/agents-sandbox-*; do
            sha="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$sha" "$(basename "$asset")"
          done >> checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "agents-sandbox ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            artifacts/*/*
            artifacts/checksums.txt

      - name: Bump Homebrew formula
        if: env.IS_PRERELEASE != 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -E -i "s|(releases/download/)v[0-9][^/]*/|\1v${version}/|g" Formula/agents-sandbox.rb
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            sha="$(sha256sum "artifacts/agents-sandbox-${target}/agents-sandbox-${target}" | cut -d' ' -f1)"
            awk -v target="$target" -v sha="$sha" '
              index($0, target) { pending = 1 }
              pending && /sha256/ { sub(/sha256 "[0-9a-f]*"/, "sha256 \"" sha "\""); pending = 0 }
              { print }
            ' Formula/agents-sandbox.rb > Formula/agents-sandbox.rb.tmp
            mv Formula/agents-sandbox.rb.tmp Formula/agents-sandbox.rb
          done
          git --no-pager diff Formula/agents-sandbox.rb

      - name: Open Homebrew formula bump PR
        if: env.IS_PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/agents-sandbox.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          branch="chore/homebrew-formula-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(release): bump Homebrew formula to ${VERSION}" Formula/agents-sandbox.rb
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): bump Homebrew formula to ${VERSION}" \
            --body "Automated bump of \`Formula/agents-sandbox.rb\` to ${VERSION} so Homebrew installs stay current (see #66). The force-push above refreshed any still-open bump PR." \
            || echo "An open bump PR already exists; it was updated by the force-push."
          gh pr merge --auto --squash "$branch" \
            || echo "Auto-merge not available for this repo; merge the bump PR manually."

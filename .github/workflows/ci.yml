name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./...
      - run: make validate-fmt

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: make coverage-junit
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
          - target: linux-arm64
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            zig_target: aarch64-macos.11.0-none
    steps:
      - uses: actions/checkout@v7

      - name: Install zig
        run: |
          ZIG_VERSION=0.16.0
          TARBALL=zig-x86_64-linux-${ZIG_VERSION}.tar.xz
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "/tmp/${TARBALL}"
          tar -xf "/tmp/${TARBALL}" -C /opt
          rm "/tmp/${TARBALL}"
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Bake macOS linker stubs into zig libc
        if: matrix.goos == 'darwin'
        run: |
          ZIG_ROOT="$(dirname "$(command -v zig)")"
          DARWIN="$ZIG_ROOT/lib/libc/darwin"
          mkdir -p "$DARWIN/System/Library/Frameworks/CoreFoundation.framework"
          mkdir -p "$DARWIN/System/Library/Frameworks/Security.framework"
          mkdir -p "$DARWIN/usr/lib"
          cp ci/builder/stubs/CoreFoundation.tbd "$DARWIN/System/Library/Frameworks/CoreFoundation.framework/"
          cp ci/builder/stubs/Security.tbd      "$DARWIN/System/Library/Frameworks/Security.framework/"
          cp ci/builder/stubs/libresolv.tbd     "$DARWIN/usr/lib/"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve bare version
        run: |
          echo "BARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: make build-release VERSION="${BARE_VERSION}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ZIG_TARGET: ${{ matrix.zig_target }}

      - name: Validate binary
        run: |
          f="agents-sandbox-${{ matrix.target }}"
          test -s "$f"
          # Verify the correct executable format per target via magic header.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "7f454c46" ]   # \x7fELF
          else
            [ "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" = "cffaedfe" ]   # Mach-O 64
          fi
          # Native execution smoke test only where the runner arch matches.
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            ./"$f" version
          fi
          file "$f"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agents-sandbox-${{ matrix.target }}
          path: agents-sandbox-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "agents-sandbox ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/*/*

      - name: Bump Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -E -i "s|(releases/download/)v[0-9][^/]*/|\1v${version}/|g" Formula/agents-sandbox.rb
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            sha="$(sha256sum "artifacts/agents-sandbox-${target}/agents-sandbox-${target}" | cut -d' ' -f1)"
            awk -v target="$target" -v sha="$sha" '
              index($0, target) { pending = 1 }
              pending && /sha256/ { sub(/sha256 "[0-9a-f]*"/, "sha256 \"" sha "\""); pending = 0 }
              { print }
            ' Formula/agents-sandbox.rb > Formula/agents-sandbox.rb.tmp
            mv Formula/agents-sandbox.rb.tmp Formula/agents-sandbox.rb
          done
          git --no-pager diff Formula/agents-sandbox.rb

      - name: Open Homebrew formula bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/agents-sandbox.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          branch="chore/homebrew-formula-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(release): bump Homebrew formula to ${VERSION}" Formula/agents-sandbox.rb
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): bump Homebrew formula to ${VERSION}" \
            --body "Automated bump of \`Formula/agents-sandbox.rb\` to ${VERSION} so Homebrew installs stay current (see #66). The force-push above refreshed any still-open bump PR." \
            || echo "An open bump PR already exists; it was updated by the force-push."
          gh pr merge --auto --squash "$branch" \
            || echo "Auto-merge not available for this repo; merge the bump PR manually."

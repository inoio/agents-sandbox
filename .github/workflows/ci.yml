name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
          args: run ./...
      - run: make validate-fmt

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: make coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
          - target: linux-arm64
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            zig_target: aarch64-macos.11.0-none
    steps:
      - uses: actions/checkout@v7

      - name: Install zig
        run: |
          ZIG_VERSION=0.16.0
          TARBALL=zig-x86_64-linux-${ZIG_VERSION}.tar.xz
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "/tmp/${TARBALL}"
          tar -xf "/tmp/${TARBALL}" -C /opt
          rm "/tmp/${TARBALL}"
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Bake macOS linker stubs into zig libc
        if: matrix.goos == 'darwin'
        run: |
          ZIG_ROOT="$(dirname "$(command -v zig)")"
          DARWIN="$ZIG_ROOT/lib/libc/darwin"
          mkdir -p "$DARWIN/System/Library/Frameworks/CoreFoundation.framework"
          mkdir -p "$DARWIN/System/Library/Frameworks/Security.framework"
          mkdir -p "$DARWIN/usr/lib"
          cp ci/builder/stubs/CoreFoundation.tbd "$DARWIN/System/Library/Frameworks/CoreFoundation.framework/"
          cp ci/builder/stubs/Security.tbd      "$DARWIN/System/Library/Frameworks/Security.framework/"
          cp ci/builder/stubs/libresolv.tbd     "$DARWIN/usr/lib/"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve bare version
        run: |
          echo "BARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: make build-release VERSION="${BARE_VERSION}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ZIG_TARGET: ${{ matrix.zig_target }}

      - name: Validate binary
        run: |
          ./opencode-sandbox-${{ matrix.target }} version
          file "opencode-sandbox-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-sandbox-${{ matrix.target }}
          path: opencode-sandbox-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "opencode-sandbox ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/*/*
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Inject release version
        working-directory: docs
        run: |
          mkdir -p _data
          echo "release: $DOCS_VERSION" > _data/version.yml
        env:
          DOCS_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Render PlantUML diagrams
        working-directory: docs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre
          curl -fsSL "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml.jar" -o /tmp/plantuml.jar
          cd diagrams && java -jar /tmp/plantuml.jar -DRELATIVE_INCLUDE -tsvg -o . $(find . -maxdepth 1 -name '*.puml' ! -name 'C4*' -printf '%f ')
        env:
          PLANTUML_VERSION: 1.2026.7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build Jekyll site
        working-directory: docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
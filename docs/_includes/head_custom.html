<script>
/* NOTE: This inline script is minified onto a single line by the Jekyll build, so a `//` line comment would
   swallow everything after it and disable the script. Only use block comments (slash-star ... star-slash) here. */
(function () {
  function saved() {
    try {
      var v = window.localStorage.getItem("jtd-theme");
      return v === "dark" || v === "light" ? v : null;
    } catch (e) {
      return null;
    }
  }
  function preferred() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
  }
  function apply(scheme) {
    var link = document.querySelector("link[rel='stylesheet']");
    if (link) {
      link.href = link.href.replace(/just-the-docs-(default|light|dark)\.css/, "just-the-docs-" + scheme + ".css");
    }
  }
  var savedScheme = saved();
  var initialScheme = savedScheme || preferred();
  apply(initialScheme);
  var mql = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if (mql && mql.addEventListener) {
    mql.addEventListener("change", function (e) {
      if (saved()) return;
      apply(e.matches ? "dark" : "light");
    });
  }
})();
</script>
<script>
/* NOTE: Same as above - only use block comments in this single-line-minified inline script. */
(function () {
  function expandAll() {
    var siteNav = document.getElementById("site-nav");
    if (!siteNav) return;
    siteNav.querySelectorAll(".nav-list-item").forEach(function (item) {
      if (item.querySelector(":scope > .nav-list")) {
        item.classList.add("active");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", expandAll);
  } else {
    expandAll();
  }
})();
</script>

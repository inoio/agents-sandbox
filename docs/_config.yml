title: agents-sandbox
tagline: Sandbox for Claude Code, opencode & pi in a microVM
description: >-
  Sandbox for AI coding agents: run Claude Code, opencode or pi in an isolated microVM on Linux or macOS, with your
  project mounted and secrets kept on the host.

# Absolute URLs for canonical links, sitemap and structured data.
url: https://inoio.github.io
baseurl: /agents-sandbox

remote_theme: just-the-docs/just-the-docs@v0.10.0

# https://github.com/just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Project navigation (order matters).
aux_links:
  "agents-sandbox on GitHub":
    - "https://github.com/inoio/agents-sandbox"

# just-the-docs theme options.
search_enabled: true
heading_anchors: true
color_scheme: light
back_to_top: true

# Avoid copying build artefacts and local-only trees into the deployed site.
# superpowers/ is gitignored tooling (see AGENTS.md); vendor/ is the Ruby gem
# bundle. Both are absent in CI but present locally, and Jekyll would otherwise
# copy them into _site/.
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - superpowers
  - vendor

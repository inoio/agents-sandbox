title: agents-sandbox
description: >-
  Run supported coding agents inside a local microsandbox VM with a separate guest kernel and your project mounted at /workspace.
# Absolute URLs for canonical links, sitemap and structured data.
url: https://inoio.github.io
baseurl: /agents-sandbox

remote_theme: just-the-docs/just-the-docs@v0.10.0

# https://github.com/just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Project navigation (order matters).
aux_links:
  "agents-sandbox on GitHub":
    - "https://github.com/inoio/agents-sandbox"

# just-the-docs theme options.
search_enabled: true
heading_anchors: true
color_scheme: light
back_to_top: true

# Avoid copying build artefacts into the deployed site.
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
